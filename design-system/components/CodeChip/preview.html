<!doctype html>
<html>
<head><meta charset="utf-8"><title>CodeChip — preview</title></head>
<body style="background:var(--surface)">
<div id="root" class="oq-stage" style="max-width:420px"></div>
<script>
  var Q = window.OpenQR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('p', { className: 'oq-caption' }, 'On a code in the camera view'),
    h('div', { style: { display: 'flex', gap: '12px', flexWrap: 'wrap' } },
      h(Q.CodeChip, { kind: 'web', label: 'example.com' }), h(Q.CodeChip, { kind: 'youtube' })),
    h('p', { className: 'oq-caption' }, 'Scanned list (second row has left view)'),
    h(Q.CodeChip, { variant: 'row', kind: 'wifi', label: 'Join Cafe-North' }),
    h(Q.CodeChip, { variant: 'row', kind: 'store', inView: false }),
    h(Q.CodeChip, { variant: 'row', kind: 'unsupported' })
  ));
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>OpenQR boot splash</title>
  <!-- The Corner mark (48-unit grid, from branding/build_icons.py) above the
       wordmark, on the graphite tile so it reads on black and on passthrough.
       Bracket box (grid 8..40) is 400px: scale 12.5, centred at (512, 420). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d33"/><stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <g transform="translate(212 120) scale(12.5)">
    <path d="M8 30V14a6 6 0 0 1 6-6h16" fill="none" stroke="#f5f8f9" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 18v16a6 6 0 0 1-6 6H18" fill="none" stroke="#f5f8f9" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <rect x="17" y="17" width="14" height="14" rx="4" fill="url(#acc)"/>
  </g>
  <text x="512" y="842" text-anchor="middle" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-size="128" font-weight="600" letter-spacing="-1.28" fill="#f5f8f9">OpenQR</text>
</svg>
